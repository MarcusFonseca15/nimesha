<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimesha</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            background: #0f102f;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            background: white;
        }

        #topview {
            position: fixed;
            top: calc(50% - 350px);
            left: calc(50% + 460px);
            width: 200px;
            height: 150px;
            border: 2px solid white;
            background: #eede2a;
        }
    </style>
    
</head>
<body>
    <canvas id="canvas" width="900" height="700"></canvas>
    <canvas id="topview" width="200" height="150"></canvas>

    <script src="js/entities.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/topview.js"></script>

    
</body>
</html>
